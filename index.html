<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tetris - 極致霓虹俄羅斯方塊</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00f2ff;
            --text-color: #ffffff;
            --font-main: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 40%);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 2rem;
            padding: 2.5rem;
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            border-radius: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        canvas#tetris { display: block; }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 220px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas#next { width: 100px; height: 100px; }

        .controls-hint {
            margin-top: auto;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            line-height: 2;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.2rem;
            border-radius: 16px;
        }

        kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            color: #fff;
            border-bottom: 2px solid rgba(0,0,0,0.3);
            margin-right: 4px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 40px;
            visibility: hidden;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.1);
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
            transform: scale(1);
        }

        .overlay h2 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #00f2ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .overlay p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 3rem;
        }

        button {
            background: linear-gradient(135deg, #00f2ff, #0066ff);
            border: none;
            padding: 1.4rem 4rem;
            border-radius: 100px;
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 15px 40px rgba(0, 242, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 242, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="canvas-wrapper">
            <canvas id="tetris" width="240" height="480"></canvas>
        </div>
        
        <div class="side-panel">
            <div class="stat-box">
                <div class="stat-label">分數</div>
                <div id="score" class="stat-value">0</div>
            </div>
            
            <div class="stat-box">
                <div class="stat-label">下一個</div>
                <div class="preview-box">
                    <canvas id="next" width="100" height="100"></canvas>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">等級</div>
                <div id="level" class="stat-value">1</div>
            </div>

            <div class="controls-hint">
                <p><kbd>←</kbd><kbd>→</kbd> 移動</p>
                <p><kbd>↑</kbd> 旋轉方塊</p>
                <p><kbd>↓</kbd> 軟降</p>
                <p><kbd>空白</kbd> <b>直接落地</b></p>
            </div>
        </div>

        <div id="start-overlay" class="overlay active">
            <h2>NEON TETRIS</h2>
            <p>準備好體驗極致速度了嗎？</p>
            <button id="start-btn">開始遊戲</button>
        </div>

        <div id="game-over-overlay" class="overlay">
            <h2>GAME OVER</h2>
            <p id="final-score-text"></p>
            <button id="restart-btn">再玩一次</button>
        </div>
    </div>

    <script>
        // --- 音效引擎 ---
        const AudioEngine = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                if (!this.ctx || this.ctx.state === 'suspended') return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if(type === 'move') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
                    osc.start(); osc.stop(now + 0.05);
                } else if(type === 'rotate') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
                    osc.start(); osc.stop(now + 0.08);
                } else if(type === 'drop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(80, now);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(); osc.stop(now + 0.1);
                } else if(type === 'clear') {
                    const osc2 = this.ctx.createOscillator();
                    osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(440, now);
                    osc2.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                    const gain2 = this.ctx.createGain();
                    osc2.connect(gain2); gain2.connect(this.ctx.destination);
                    gain2.gain.setValueAtTime(0.1, now); gain2.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc2.start(); osc2.stop(now + 0.3);
                }
            }
        };

        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        const COLS = 10, ROWS = 20, BLOCK_SIZE = 24;
        context.scale(BLOCK_SIZE, BLOCK_SIZE);
        nextContext.scale(BLOCK_SIZE, BLOCK_SIZE);

        const colors = [null, '#00f2ff', '#0066ff', '#ff8e0d', '#ffe138', '#0dff72', '#f538ff', '#ff0d72'];
        const pieces = 'I J L O S T Z'.split(' ');

        let arena = createMatrix(COLS, ROWS);
        let player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1 };
        let dropCounter = 0, dropInterval = 1000, lastTime = 0, isPaused = true;

        function createMatrix(w, h) { return Array.from({length: h}, () => new Array(w).fill(0)); }

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
            if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
            if (type === 'T') return [[0,0,0],[6,6,6],[0,6,0]];
            if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
        }

        function draw() {
            context.fillStyle = '#0a0a12';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0}, context);
            drawGhost();
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawMatrix(matrix, offset, ctx, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        if (isGhost) {
                            ctx.globalAlpha = 0.1;
                            ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                            ctx.globalAlpha = 1;
                        } else {
                            ctx.shadowBlur = 10; ctx.shadowColor = colors[value];
                            ctx.fillRect(x + offset.x + 0.05, y + offset.y + 0.05, 0.9, 0.9);
                            ctx.shadowBlur = 0;
                        }
                    }
                });
            });
        }

        function drawGhost() {
            const ghost = { pos: {x: player.pos.x, y: player.pos.y}, matrix: player.matrix };
            while (!collide(arena, ghost)) ghost.pos.y++;
            ghost.pos.y--;
            if (ghost.pos.y > player.pos.y) drawMatrix(ghost.matrix, ghost.pos, context, true);
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function rotate(matrix) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
            matrix.forEach(row => row.reverse());
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep(); // 執行消行判斷
                updateScore();
                AudioEngine.play('drop');
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep(); // 執行消行判斷
            updateScore();
            AudioEngine.play('drop');
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
            else AudioEngine.play('move');
        }

        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix); rotate(player.matrix); rotate(player.matrix);
                    player.pos.x = pos; return;
                }
            }
            AudioEngine.play('rotate');
        }

        function playerReset() {
            if (!player.next) player.next = createPiece(pieces[Math.random() * pieces.length | 0]);
            player.matrix = player.next;
            player.next = createPiece(pieces[Math.random() * pieces.length | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) gameOver();
            drawNext();
        }

        function arenaSweep() {
            let rowCount = 0;
            // 從最後一行開始向上掃描
            for (let y = arena.length - 1; y >= 0; --y) {
                let isFull = true;
                // 檢查該行是否所有格子都不是 0 (代表滿格)
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        isFull = false;
                        break;
                    }
                }

                if (isFull) {
                    // 移除滿行並在頂部補上一行空的
                    const row = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(row);
                    ++y; // 因為陣列索引變動，需要重新檢查當前行索引
                    rowCount++;
                    player.score += 100; // 每消一行加 100 分
                    AudioEngine.play('clear');
                }
            }
        }

        function drawNext() {
            nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            const ox = (nextCanvas.width/BLOCK_SIZE - player.next[0].length)/2;
            const oy = (nextCanvas.height/BLOCK_SIZE - player.next.length)/2;
            drawMatrix(player.next, {x: ox, y: oy}, nextContext);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            player.level = (player.score / 1000 | 0) + 1;
            document.getElementById('level').innerText = player.level;
            dropInterval = Math.max(100, 1000 - (player.level - 1) * 150);
        }

        function gameOver() {
            isPaused = true;
            document.getElementById('final-score-text').innerText = `最終分數：${player.score}`;
            document.getElementById('game-over-overlay').classList.add('active');
        }

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            if (!isPaused) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
                draw();
            }
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', e => {
            if (isPaused) return;
            if (e.code === 'ArrowLeft') playerMove(-1);
            if (e.code === 'ArrowRight') playerMove(1);
            if (e.code === 'ArrowDown') playerDrop();
            if (e.code === 'ArrowUp') playerRotate();
            if (e.code === 'Space') { playerHardDrop(); e.preventDefault(); }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            AudioEngine.init(); arena = createMatrix(COLS, ROWS); player.score = 0; player.next = null;
            playerReset(); updateScore(); isPaused = false; lastTime = performance.now();
            document.getElementById('start-overlay').classList.remove('active');
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            arena = createMatrix(COLS, ROWS); player.score = 0; player.next = null;
            playerReset(); updateScore(); isPaused = false; lastTime = performance.now();
            document.getElementById('game-over-overlay').classList.remove('active');
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
